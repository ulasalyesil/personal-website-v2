<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR code icons</title>
<style>
:root {
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --ink: #5d3ebc;
  --tile: #fafafa;
  --bg: #fff;
  --text: #1a1a1a;
  --line: #f3f0fe;
  --dim: #868686; /* the dashboard under the Dark Layer, behind the sheet */
  --k: 1; /* time multiplier, 4 = quarter speed */
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
}
/* close-ups first, the full sheet mockup under them */
main {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(32px, 5vw, 56px);
  padding: clamp(24px, 4vw, 56px) 16px;
}

/* the sheet as it ships, rendered from Figma, with live icons over the baked ones */
.phone-slot { width: calc(375px * var(--s, 0.75)); height: calc(812px * var(--s, 0.75)); }
.phone {
  position: relative;
  width: 375px;
  height: 812px;
  overflow: hidden;
  border-radius: 44px;
  background: var(--dim);
  box-shadow: 0 0 0 1px rgb(0 0 0 / 0.06);
  transform: scale(var(--s, 0.75));
  transform-origin: top left;
}
.dash { position: absolute; top: 0; left: 0; display: block; width: 375px; height: 432px; }
.sheet { position: absolute; top: 432px; left: 0; width: 375px; height: 380px; }
.sheet > img { display: block; width: 375px; height: 380px; }
.stile { position: absolute; left: 28px; width: 48px; height: 48px; padding: 8px; border-radius: 50%; background: var(--tile); }
.stile svg { display: block; width: 32px; height: 32px; overflow: visible; }

/* the same three icons, close up */
.closeup {
  width: min(100%, 760px);
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: clamp(12px, 2.5vw, 32px);
  align-items: center;
  justify-items: center;
}
.cell { margin: 0; display: grid; gap: 16px; justify-items: center; }
.tile {
  width: min(100%, 220px);
  aspect-ratio: 1;
  border-radius: 50%;
  background: var(--tile);
  padding: 16.667%; /* 8px of 48px */
}
.tile svg { display: block; width: 100%; height: 100%; overflow: visible; }
figcaption { color: var(--ink); font-weight: 500; font-size: clamp(13px, 1.6vw, 18px); white-space: nowrap; }

.controls { display: flex; gap: 8px; justify-content: center; margin-top: -8px; }
button {
  font: inherit;
  font-size: 14px;
  padding: 8px 16px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--bg);
  color: var(--ink);
  cursor: pointer;
  transition: background-color 150ms ease, transform 160ms var(--ease-out);
}
button:active { transform: scale(0.97); }
button[aria-pressed="true"] { background: var(--ink); color: #fff; }
@media (hover: hover) and (pointer: fine) {
  button:hover { background: var(--line); }
  button[aria-pressed="true"]:hover { background: var(--ink); }
}

/* motion: transform, opacity, and stroke draw-on only. Nothing is positioned by layout.
   Each part waits on its first frame until it scrolls into view (.play), and .reset restarts it. */
.stage:not(.play) * { animation-play-state: paused !important; }
.stage.reset * { animation: none !important; }
.stage .sheet { animation: sheet calc(440ms * var(--k)) var(--ease-drawer) both; }
.stage .tile { animation: tile calc(260ms * var(--k)) var(--ease-out) calc(var(--d) * var(--k)) both; }
.stage svg * { transform-box: fill-box; transform-origin: center; }

/* qr: corners draw on, the check pops, the code squares settle in */
.stage .c { stroke-dasharray: 1 1; animation: draw calc(300ms * var(--k)) var(--ease-out) both; }
.stage .c1 { animation-delay: calc((var(--d) + 0ms) * var(--k)); }
.stage .c2 { animation-delay: calc((var(--d) + 40ms) * var(--k)); }
.stage .c3 { animation-delay: calc((var(--d) + 80ms) * var(--k)); }
.stage .ring { animation: pop calc(380ms * var(--k)) var(--ease-out) calc((var(--d) + 180ms) * var(--k)) both; }
.stage .q { animation: pop-sm calc(240ms * var(--k)) var(--ease-out) both; }
.stage .q1 { animation-delay: calc((var(--d) + 300ms) * var(--k)); }
.stage .q2 { animation-delay: calc((var(--d) + 340ms) * var(--k)); }
.stage .q3 { animation-delay: calc((var(--d) + 380ms) * var(--k)); }
.stage .q4 { animation-delay: calc((var(--d) + 420ms) * var(--k)); }

/* the slot settles in first */
.stage .tray { animation: tray calc(260ms * var(--k)) var(--ease-out) calc(var(--d) * var(--k)) both; }
/* withdraw: the banknote comes out of the slot, the arrow follows it out.
   deposit: the arrow pushes the banknote up, into the slot. Both clipped at the slot edge. */
.stage .withdraw .note { animation: note-out calc(380ms * var(--k)) var(--ease-out) calc((var(--d) + 80ms) * var(--k)) both; }
.stage .withdraw .arrow { animation: arrow-out calc(380ms * var(--k)) var(--ease-out) calc((var(--d) + 240ms) * var(--k)) both; }
.stage .deposit .note { animation: note-in calc(420ms * var(--k)) var(--ease-out) calc((var(--d) + 80ms) * var(--k)) both; }
.stage .deposit .arrow { animation: arrow-in calc(420ms * var(--k)) var(--ease-out) calc((var(--d) + 120ms) * var(--k)) both; }

@keyframes sheet { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes tile { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }
@keyframes draw { from { stroke-dashoffset: 1; opacity: 0; } 15% { opacity: 1; } to { stroke-dashoffset: 0; opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: scale(1); } }
@keyframes pop-sm { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }
@keyframes tray { from { opacity: 0; transform: translateY(-3%); } to { opacity: 1; transform: translateY(0); } }
/* note offsets in px = SVG user units (the note's visible part is 9.5 tall) */
@keyframes note-out { from { transform: translateY(-9.5px); } to { transform: translateY(0); } }
@keyframes note-in { from { opacity: 0; transform: translateY(4.75px); } 25% { opacity: 1; } to { opacity: 1; transform: translateY(0); } }
@keyframes arrow-out { from { transform: translateY(-130%); } to { transform: translateY(0); } }
@keyframes arrow-in { from { opacity: 0; transform: translateY(80%); } 30% { opacity: 1; } to { opacity: 1; transform: translateY(0); } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* reduced motion: keep the appearance, drop the movement */
@media (prefers-reduced-motion: reduce) {
  .stage .sheet, .stage .tile, .stage .c, .stage .ring, .stage .q, .stage .tray, .stage .note, .stage .arrow {
    animation: fade calc(200ms * var(--k)) ease both;
    animation-delay: 0ms;
    stroke-dasharray: none;
  }
}

/* still render for the close-up export */
html.still * { animation: none !important; }
html.still .controls, html.still .phone-slot { display: none; }
html.still main { padding: 64px 48px; }
html.still .closeup { width: auto; gap: 80px; grid-template-columns: repeat(3, auto); }
html.still .tile { width: 400px; }
html.still figcaption { font-size: 36px; }
</style>
</head>

<script>
var root = document.documentElement;
if (location.hash === "#still") root.classList.add("still");
var stages = [].slice.call(document.querySelectorAll(".stage"));

// the phone shows at full size, shrinking only when the frame is narrower than it
function fit() {
  root.style.setProperty("--s", Math.min(1, (root.clientWidth - 32) / 375).toFixed(3));
}

fit();
window.addEventListener("resize", fit);

// Inside an iframe the default root is the top-level viewport, so this fires when the
// part is actually on screen in the Lab page, not just inside the frame
var io = new IntersectionObserver(function (entries) {
  entries.forEach(function (entry) {
    if (!entry.isIntersecting) return;
    entry.target.classList.add("play");
    io.unobserve(entry.target);
  });
}, { threshold: 0.8 });
stages.forEach(function (stage) { io.observe(stage); });

function replay() {
  stages.forEach(function (stage) { stage.classList.add("reset"); });
  void document.body.offsetWidth;
  stages.forEach(function (stage) {
    stage.classList.remove("reset");
    stage.classList.add("play");
  });
}
document.getElementById("replay").addEventListener("click", replay);
var slow = document.getElementById("slow");
slow.addEventListener("click", function () {
  var on = slow.getAttribute("aria-pressed") !== "true";
  slow.setAttribute("aria-pressed", String(on));
  root.style.setProperty("--k", on ? "4" : "1");
  replay();
});
</script>
